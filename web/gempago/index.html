<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>젬파고 - 가공 계산기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M7.2 2.6h9.6l4.2 6.2L12 21.6 3 8.8z' fill='%234d8dfa'/%3E%3Cpath d='M7.2 2.6 3 8.8h18l-4.2-6.2z' fill='%23ffffff' opacity='.3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=2026-08-15.11">
</head>
<body>

<header class="top">
  <!-- 브릴리언트 컷 한 알. 이모지 대신 SVG 로 그린다(전역 규칙). 색은 CSS 변수를 따라간다. -->
  <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
    <defs>
      <linearGradient id="gemFace" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="var(--accent-2)"/>
        <stop offset="1" stop-color="var(--accent)"/>
      </linearGradient>
    </defs>
    <path d="M7.2 2.6h9.6l4.2 6.2L12 21.6 3 8.8z" fill="url(#gemFace)"/>
    <path d="M7.2 2.6 3 8.8h18l-4.2-6.2z" fill="#fff" opacity=".22"/>
    <path d="M3 8.8h18L12 21.6z" fill="#000" opacity=".14"/>
    <path d="M7.2 2.6 12 21.6l4.8-19M3 8.8h18" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width=".7"/>
  </svg>
  <h1>젬파고</h1>
  <p class="sub">젬 가공 도우미</p>
</header>

<main class="cols">

    <section class="live span-all">
      <button type="button" id="shareBtn">화면 공유 시작</button>
      <span class="live-state" id="liveState">젬 가공화면을 1920*1080 창모드 화면공유를 해주세요.</span>
      <button type="button" id="readBtn" class="ghost" disabled>한 번 읽기</button>
      <label class="toggle"><input type="checkbox" id="autoRead" checked disabled> 자동</label>
    </section>

  <div class="col col-left">

    <details class="panel fold" id="foldGem">
      <summary>
        <span class="fold-title">읽은 젬</span>
        <span class="fold-sum" id="gemSummary">아직 안 읽었다</span>
      </summary>
      <div class="fold-body">
        <p class="hint"></p>

        <div class="stats" id="stats"></div>
        <div class="sumline">
          <span>젬 포인트 합계</span>
          <strong id="gemPointSum">-</strong>
        </div>

        <label class="row">
          <span>젬 등급</span>
          <select id="grade">
            <option value="5">고급 (가공 5회)</option>
            <option value="7">희귀 (가공 7회)</option>
            <option value="9" selected>영웅 (가공 9회)</option>
          </select>
        </label>

        <label class="row">
          <span>젬 계열</span>
          <select id="gemType">
            <option value="혼돈 포인트" selected>혼돈</option>
            <option value="질서 포인트">질서</option>
          </select>
        </label>

        <label class="row">
          <span>1번 효과 이름</span>
          <input id="name_opt1" type="text" placeholder="공격력" autocomplete="off">
        </label>
        <label class="row">
          <span>2번 효과 이름</span>
          <input id="name_opt2" type="text" placeholder="아군 피해 강화" autocomplete="off">
        </label>


        <label class="row">
          <span>남은 가공</span>
          <select id="attempts"></select>
        </label>

        <label class="row">
          <span>남은 리롤</span>
          <select id="rerolls"></select>
        </label>

        <label class="row last">
          <span>가공 비용</span>
          <select id="cost">
            <option value="0" selected>기본</option>
            <option value="1">+100%</option>
            <option value="-1">-100%</option>
          </select>
        </label>
      </div>
    </details>

    <details class="panel fold" id="foldRead">
      <summary>
        <span class="fold-title">읽기 상세</span>
        <span class="fold-sum" id="readSummary"></span>
      </summary>
      <div class="fold-body">
        <p class="hint">캡처한 PNG 를 이 창에 끌어다 놓아도 됩니다.</p>
        <div class="capture-row">
          <button type="button" id="saveFrameBtn" disabled>이 화면 저장</button>
        </div>
        <p class="capture-status" id="captureStatus"></p>
        <video id="preview" muted playsinline hidden></video>
      </div>
    </details>

  </div>

  <div class="col col-center">

    <details class="panel fold" id="foldPicks">
      <summary>
        <span class="fold-title">랜덤 항목 4개</span>
      </summary>
      <div class="fold-body">
        <p class="hint">자동으로 채워집니다.</p>
        <div class="picks" id="picks"></div>
        <p class="capture-status" id="pickStatus" hidden></p>
      </div>
    </details>

    <section class="answer" id="result" hidden>
      <div class="verdict" id="verdict"></div>

      <div class="compare">
        <div class="opt" id="optCommit">
          <span class="k">가공하기</span>
          <strong class="v" id="valCommit">-</strong>
        </div>
        <div class="opt" id="optReroll">
          <span class="k">리롤</span>
          <strong class="v" id="valReroll">-</strong>
        </div>
      </div>

      <table class="breakdown">
        <thead><tr><th>걸리는 항목</th><th>적용 후 달성 확률</th></tr></thead>
        <tbody id="breakdown"></tbody>
      </table>

      <p class="meta" id="meta"></p>
    </section>

    <section class="note" id="note">
      <span class="spinner" id="noteSpin"></span>
      <strong>계산 준비 중</strong>
      <span id="noteText"></span>
    </section>

  </div>

  <div class="col col-right">

    <section class="panel">
      <h2>목표</h2>
      <p class="hint">목표를 설정해주세요.</p>

      <div class="presets" id="presets">
        <button type="button" data-target='{"will":5,"point":5}'>의지력/포인트 5/5</button>
        <button type="button" data-target='{"will":5,"point":5,"opt1":5,"opt2":5}'>전부 5/5/5/5</button>
        <button type="button" data-target='{"opt1":4}'>1번 효과 4 이상</button>
        <button type="button" data-target='{"will":4,"point":4}'>의지력/포인트 4/4</button>
      </div>

      <div class="stats" id="target"></div>
      <p class="hint last">1 은 상관없음과 같습니다.</p>
    </section>

  </div>

</main>

<script src="vision/atlas-browser.js?v=2026-08-15.11"></script>
<script src="app.js?v=2026-08-15.11"></script>
</body>
</html>
