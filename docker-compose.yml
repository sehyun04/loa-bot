services:
  bot:
    build: .
    image: loa-bot:latest
    container_name: loa-bot
    # 서버 재부팅이나 크래시 후에도 알아서 살아나야 한다
    restart: unless-stopped
    env_file: .env
    environment:
      BOT_DATA_DIR: /data
      # 로그 시각을 KST로 맞춘다. 게임 리셋·떠상 시각이 전부 KST라
      # 로그가 UTC면 사고 시각을 매번 환산해야 한다.
      TZ: Asia/Seoul
    volumes:
      # SQLite를 호스트에 두어야 컨테이너를 갈아끼워도 숙제 기록이 남는다
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
